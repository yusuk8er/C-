name: Upload C/C++ library identification data

on:
  workflow_dispatch:
    inputs:
      lib:
        description: "library name (directory name under third_party)"
        default: "curl"
        required: true
      repo:
        description: "GitHub owner/repo"
        default: "curl/curl"
        required: true
      tag:
        description: "git tag (e.g. curl-8_3_0 = vulnerable, curl-8_4_0 = fixed)"
        default: "curl-8_3_0"
        required: true

permissions:
  contents: read

jobs:
  upload-cpp-library:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch library source (trial only)
        shell: bash
        run: |
          set -euo pipefail
          LIB="${{ github.event.inputs.lib }}"
          REPO="${{ github.event.inputs.repo }}"
          TAG="${{ github.event.inputs.tag }}"
          mkdir -p third_party src
          curl -fsSL -o src.tar.gz "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          tar -xzf src.tar.gz -C src
          mv src/* "third_party/${LIB}"
          echo "--- third_party/${LIB} ---"
          ls "third_party/${LIB}" | head

      - name: Generate C/C++ library identification data
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o futurevuls-cpp-fingerprint.sh https://installer.vuls.biz/futurevuls-cpp-fingerprint.sh
          bash futurevuls-cpp-fingerprint.sh third_party/*/
          echo "--- generated json (head) ---"
          head -c 300 futurevuls-cpp-library.json; echo

      - name: Debug - ask OSV directly
        shell: bash
        run: |
          set -euo pipefail
          jq '{name: .components[0].label, file_hashes: [.components[0].hashes[] | {hash: .}]}' \
            futurevuls-cpp-library.json > osv-req.json
          curl -fsS -X POST https://api.osv.dev/v1experimental/determineversion \
            -H 'Content-Type: application/json' --data @osv-req.json | jq '.matches[:5]'

      - name: Upload C/C++ library identification data
        uses: futurevuls/fvuls-lockfile-uploader@9245e71ad5a5833acf0196650027fc4a6be78921 # v2
        env:
          FVULS_SERVER_UUID: ${{ secrets.FVULS_SERVER_UUID }}
          FVULS_TOKEN: ${{ secrets.FVULS_TOKEN }}
        with:
          repoName: ${{ github.repository }}
          path: "./futurevuls-cpp-library.json"
